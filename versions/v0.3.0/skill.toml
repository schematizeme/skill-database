[descriptions]
pt = "Modelagem de banco de dados da casa (schema design, agnóstica de linguagem): o DESENHO do schema relacional — entidades→tabelas, atributos→colunas com o tipo certo, relações 1:1/1:N/N:N com tabela de junção, normalização 1FN–3FN (e quando desnormalizar CONSCIENTE), chaves (PK surrogate ULID/UUIDv7 + chave natural como UNIQUE; identidade≠email), constraints (NOT NULL/default, UNIQUE, CHECK, FK com ON DELETE consciente), índices (compostos/cobertura/parciais, ordem das colunas, sem PII em índice), particionamento e o piso de PII/LGPD (coluna marcada, base legal + retenção). Emite CREATE TABLE + migration expand-contract reversível + resumo do modelo. A engenharia de DADOS (pipeline/ETL/CDC/contratos/streaming) é da schematize-data; a IMPLEMENTAÇÃO (queries parametrizadas, ORM, rodar migration) é das skills de linguagem."
en = "House database modeling (schema design, language-agnostic): the DESIGN of the relational schema — entities→tables, attributes→columns with the right type, 1:1/1:N/N:N relations with junction tables, normalization 1NF–3NF (and when to DELIBERATELY denormalize), keys (surrogate PK ULID/UUIDv7 + natural key as UNIQUE; identity≠email), constraints (NOT NULL/default, UNIQUE, CHECK, FK with deliberate ON DELETE), indexes (composite/covering/partial, column order, no PII in an index), partitioning and the PII/LGPD floor (marked column, legal basis + retention). Emits CREATE TABLE + reversible expand-contract migration + a model summary. DATA engineering (pipeline/ETL/CDC/contracts/streaming) belongs to schematize-data; the IMPLEMENTATION (parameterized queries, ORM, running migrations) to the language skills."
es = "Modelado de base de datos de la casa (schema design, agnóstico de lenguaje): el DISEÑO del esquema relacional — entidades→tablas, atributos→columnas con el tipo correcto, relaciones 1:1/1:N/N:N con tabla de unión, normalización 1FN–3FN (y cuándo desnormalizar CONSCIENTEMENTE), claves (PK surrogate ULID/UUIDv7 + clave natural como UNIQUE; identidad≠email), constraints (NOT NULL/default, UNIQUE, CHECK, FK con ON DELETE consciente), índices (compuestos/cobertura/parciales, orden de columnas, sin PII en índice), particionamiento y el piso de PII/LGPD (columna marcada, base legal + retención). Emite CREATE TABLE + migración expand-contract reversible + un resumen del modelo. La ingeniería de DATOS (pipeline/ETL/CDC/contratos/streaming) es de schematize-data; la IMPLEMENTACIÓN (queries parametrizadas, ORM, correr migración) de las skills de lenguaje."
